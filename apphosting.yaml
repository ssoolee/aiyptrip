# Firebase App Hosting 설정 (docs/prd/06-infra-deployment-prd.md).
# API 키는 파일에 적지 않고 Cloud Secret Manager의 시크릿을 참조한다
# (등록: npx firebase-tools apphosting:secrets:set <이름>).

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  # 비용 관리 — 트래픽이 늘면 올린다.
  maxInstances: 2
  concurrency: 80

env:
  - variable: LLM_PROVIDER
    value: gemini
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
  - variable: TOUR_API_KEY
    secret: tour-api-key
  # NAVER API HUB 지역 검색용 키
  - variable: NCP_SEARCH_KEY_ID
    secret: ncp-map-client-id
  - variable: NCP_SEARCH_KEY
    secret: ncp-map-client-secret
  - variable: NCP_MAPS_KEY_ID
    secret: ncp-maps-api-key-id
  - variable: NCP_MAPS_KEY
    secret: ncp-maps-api-key
  # 브라우저 지도 SDK용 — 빌드 때 번들에 들어가므로 BUILD에도 필요. Maps 키의 Client ID와 같은 값.
  - variable: NEXT_PUBLIC_NCP_MAPS_KEY_ID
    secret: ncp-maps-api-key-id
    availability:
      - BUILD
      - RUNTIME

  # Firebase 웹 앱 설정 (docs/prd/06-infra-deployment-prd.md) - 공개 전제 값이라
  # 시크릿이 아니라 평문으로 둔다. 브라우저 번들에 들어가므로 BUILD에도 필요.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAeJwEDAcOEX49Ao0M-iQiqwlsWpj5bcgs
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: aiyptrip.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: aiyptrip
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:355232563139:web:9f9c2cbc041c6de319c776"
    availability:
      - BUILD
      - RUNTIME
